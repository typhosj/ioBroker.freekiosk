version: 2
updates:
    - package-ecosystem: 'github-actions'
      directory: '/'
      schedule:
          interval: 'cron'
          timezone: 'Europe/Berlin'
          cronjob: '17 3 21 * *'
      open-pull-requests-limit: 15
      assignees:
          - typhosj

    - package-ecosystem: 'npm'
      directory: '/'
      schedule:
          interval: 'cron'
          timezone: 'Europe/Berlin'
          cronjob: '17 3 21 * *'
      open-pull-requests-limit: 20
      assignees:
          - typhosj
      versioning-strategy: 'increase'
      cooldown:
          default-days: 7
      ignore:
          - dependency-name: '@types/node'
            update-types:
                - 'version-update:semver-major'
          # typescript-eslint's peer range caps TypeScript at 6.0.x; TS 7 has no lib/typescript.js
          - dependency-name: 'typescript'
            update-types:
                - 'version-update:semver-major'
                - 'version-update:semver-minor'
